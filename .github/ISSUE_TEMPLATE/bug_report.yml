name: Bug report
description: Something's broken, or doesn't work the way the README says.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Switch to the visualiser
        2. Press side button 7
        3. ...
  - type: input
    id: version
    attributes:
      label: Launchpad Lights version
      description: The release you downloaded, like 0.2.0, or "from source".
    validations:
      required: true
  - type: dropdown
    id: launchpad
    attributes:
      label: Which Launchpad?
      options:
        - Launchpad Mini (original, MK1)
        - Launchpad Mini MK2
        - Something else (say which in "What happened?")
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Click Settings > General > Open logs and paste anything from launchpad-lights.log that looks related. Take out anything private first.
      render: text
