[project]
name = "lpctl"
version = "0.1.0"
description = "Launchpad Mini controller with pluggable modes (audio visualiser first)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "numpy>=1.26",
    "pyaudiowpatch>=0.2.12",
    "tomli-w>=1.0",
    "pystray>=0.19",
    "pillow>=10",
    "psutil>=5.9",
    "comtypes>=1.4",
    "pycaw>=20240210",
    "winrt-runtime>=2.0",
    "winrt-Windows.Foundation>=2.0",
    "winrt-Windows.Media.Control>=2.0",
]

[project.scripts]
lpctl = "lpctl.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
